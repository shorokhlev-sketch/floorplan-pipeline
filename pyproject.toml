[project]
name = "floorplan-pipeline"
version = "0.1.0"
description = "Architect's PDF to clean vector floor and apartment plans, by the PDF's own OCG layers."
readme = "README.md"
license = "MIT"
authors = [{ name = "Lev Skorokhodov" }]
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "shapely>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
    "playwright>=1.45",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
